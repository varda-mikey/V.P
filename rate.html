<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7b1022"><title>Rate My Service • V-POINTS</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 70px}.brand{font-size:13px;font-weight:900;color:#7b1022;letter-spacing:.7px}.card{background:#fff;border-radius:26px;padding:22px;margin-top:14px;box-shadow:0 12px 38px #17203314;text-align:center}.avatar{width:88px;height:88px;border-radius:50%;background:#eef0f4;margin:auto;display:grid;place-items:center;font-size:34px;border:4px solid #fff;box-shadow:0 3px 16px #1720331c}.name{font-size:24px;font-weight:900;margin-top:10px}.meta{font-size:13px;color:#667085;margin-top:3px}.question{font-weight:800;font-size:18px;margin:25px 0 12px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kind{border:1px solid #e5e7eb;background:#fff;border-radius:16px;padding:13px;font-weight:800}.kind.active{border:2px solid #7b1022;background:#fff7f8}.stars{display:flex;justify-content:center;gap:8px;margin:18px 0}.star{font-size:40px;background:none;border:0;padding:0;color:#d0d5dd}.star.on{color:#f5b301}.comment{width:100%;min-height:95px;border:1px solid #d0d5dd;border-radius:16px;padding:13px;font:inherit;resize:vertical}.submit{width:100%;border:0;border-radius:16px;background:#7b1022;color:white;padding:15px;font-size:16px;font-weight:900;margin-top:12px}.small{font-size:11px;line-height:1.5;color:#98a2b3;margin-top:14px}.thanks{display:none;padding:30px 8px}.thanks h2{margin-bottom:5px}.badge{display:inline-block;background:#f2f4f7;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;margin-top:9px}</style></head><body><main class="app"><div class="brand">V-POINTS • VARDA GROUP</div><section class="card" id="formCard"><div class="avatar">👤</div><div class="name" id="employeeName">Employee Service Rating</div><div class="meta" id="employeeMeta">Scan from the employee's official QR badge</div><div class="question">How was your experience?</div><div class="switch"><button class="kind active" data-kind="positive">👍 Positive</button><button class="kind" data-kind="negative">👎 Needs Improvement</button></div><div class="stars" aria-label="Rating"><button class="star" data-star="1">★</button><button class="star" data-star="2">★</button><button class="star" data-star="3">★</button><button class="star" data-star="4">★</button><button class="star" data-star="5">★</button></div><textarea class="comment" id="comment" maxlength="500" placeholder="Optional comment — tell us what happened"></textarea><button class="submit" id="submit">Submit Feedback</button><div class="small">Feedback is reviewed before it affects official V-POINTS. Please rate only your actual service experience.</div><div class="thanks" id="thanks"><h2>Thank you!</h2><div>Your feedback has been received for review.</div><div class="badge">V-POINTS Feedback</div></div></section></main><script>const qs=new URLSearchParams(location.search);const employee=qs.get('employee');const name=qs.get('name');const branch=qs.get('branch');if(name)document.getElementById('employeeName').textContent=name;if(branch)document.getElementById('employeeMeta').textContent=branch;let kind='positive',stars=0;document.querySelectorAll('.kind').forEach(b=>b.onclick=()=>{document.querySelectorAll('.kind').forEach(x=>x.classList.remove('active'));b.classList.add('active');kind=b.dataset.kind});document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{stars=+b.dataset.star;document.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',+x.dataset.star<=stars))});document.getElementById('submit').onclick=()=>{if(!employee){alert('This QR does not contain an employee ID.');return}if(!stars){alert('Please select 1 to 5 stars.');return}/* Secure Supabase submission endpoint will be wired after API exposure/RLS is finalized. */document.querySelector('.question').style.display='none';document.querySelector('.switch').style.display='none';document.querySelector('.stars').style.display='none';document.getElementById('comment').style.display='none';document.getElementById('submit').style.display='none';document.querySelector('.small').style.display='none';document.getElementById('thanks').style.display='block'};</script></body></html>
