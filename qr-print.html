<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-POINTS QR Badge Print</title><style>:root{font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#111}.tools{padding:14px;position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;justify-content:center}.tools button{border:0;border-radius:10px;background:#7b1022;color:#fff;padding:11px 16px;font-weight:700}.sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:10mm;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:54mm;gap:5mm}.badge{border:1px solid #bbb;border-radius:4mm;padding:4mm;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;break-inside:avoid}.brand{font-size:9px;font-weight:800;color:#7b1022}.name{font-size:13px;font-weight:800;margin:2mm 0 .5mm}.meta{font-size:8px;color:#555;margin-bottom:2mm}.qr{width:25mm;height:25mm;border:1px dashed #aaa;display:grid;place-items:center;font-size:8px;color:#777;background:#fff}.cta{font-size:8px;font-weight:800;margin-top:1.5mm}.hint{font-size:7px;color:#777}.empty{color:#999;font-size:10px}@page{size:A4;margin:0}@media print{body{background:#fff}.tools{display:none}.sheet{margin:0;width:210mm;min-height:297mm;box-shadow:none}}</style></head><body><div class="tools"><button onclick="window.print()">Print A4 QR Badges</button></div><main class="sheet" id="sheet"></main><script>/* QR rendering library/data wiring will be connected after secure employee API is finalized. This print template is intentionally safe and contains no private keys. */const demo=[];const sheet=document.getElementById('sheet');function badge(p){const el=document.createElement('section');el.className='badge';el.innerHTML=`<div class="brand">V-POINTS • VARDA GROUP</div><div class="name">${p.name}</div><div class="meta">${p.branch||''}</div><div class="qr">QR CODE</div><div class="cta">SCAN TO RATE MY SERVICE</div><div class="hint">Official employee feedback</div>`;return el}if(demo.length)demo.forEach(p=>sheet.appendChild(badge(p)));else{for(let i=0;i<12;i++){const e=document.createElement('section');e.className='badge';e.innerHTML='<div class="empty">Employee QR badge slot</div>';sheet.appendChild(e)}}</script></body></html>
