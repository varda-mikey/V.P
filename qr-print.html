<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-POINTS Employee QR Badge</title><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><style>:root{font-family:Inter,Arial,sans-serif;color:#182230}*{box-sizing:border-box}body{margin:0;background:#f3f4f6}.top{background:#781327;color:white;padding:18px;text-align:center}.top h1{margin:0;font-size:23px}.top p{margin:5px 0 0;opacity:.8;font-size:12px}.wrap{max-width:520px;margin:20px auto;padding:15px}.badge{background:#fff;border-radius:26px;padding:24px;text-align:center;box-shadow:0 10px 30px #00000012}.brand{font-weight:950;color:#781327;font-size:14px}.name{font-size:25px;font-weight:950;margin-top:15px}.meta{font-size:13px;color:#667085;margin:5px 0 15px}.qrbox{display:flex;justify-content:center;padding:8px}.qrbox canvas{max-width:260px;width:70%!important;height:auto!important}.cta{font-weight:950;margin-top:8px}.hint{font-size:11px;color:#667085;margin-top:4px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.buttons button,.buttons a{border:0;border-radius:14px;padding:13px;font-weight:900;text-decoration:none;text-align:center}.download{background:#781327;color:#fff}.print{background:#fff;color:#781327;border:1px solid #ddd!important}.status{text-align:center;color:#667085;padding:18px}.small{font-size:11px;color:#98a2b3;margin-top:12px}@media print{.top,.buttons,.small{display:none}body{background:white}.wrap{margin:0 auto}.badge{box-shadow:none;border:1px solid #ddd}}</style></head><body><div class="top"><h1>V-POINTS QR BADGE</h1><p>Employee customer feedback badge</p></div><main class="wrap"><div id="status" class="status">Loading employee…</div><section id="badge" class="badge" style="display:none"><div class="brand">V-POINTS • VARDA GROUP</div><div id="name" class="name"></div><div id="meta" class="meta"></div><div id="qr" class="qrbox"></div><div class="cta">SCAN TO RATE MY SERVICE</div><div class="hint">Official employee feedback</div></section><div id="buttons" class="buttons" style="display:none"><button class="download" onclick="downloadBadge()">DOWNLOAD PNG</button><button class="print" onclick="window.print()">PRINT BADGE</button></div><div class="small">The QR opens the employee’s official V-POINTS feedback page. Keep the employee UUID private from manual editing; use this generated badge.</div></main><script>const FEEDBACK='https://lwjeroszacnqibggxair.supabase.co/functions/v1/vpoints-feedback',uid=new URLSearchParams(location.search).get('employee');let emp=null,qrCanvas=null;const esc=s=>String(s||'');async function init(){if(!uid){status.textContent='Employee QR was not specified.';return}try{const r=await fetch(FEEDBACK+'?employee='+encodeURIComponent(uid));const j=await r.json();if(!r.ok)throw Error(j.error||'Employee not available');emp=j.employee||j;name.textContent=emp.full_name||emp.name||'V-POINTS Employee';meta.textContent=emp.branch_name||emp.branch||emp.area_name||'Varda Group';const url=new URL('rate.html',location.href);url.searchParams.set('employee',uid);qrCanvas=document.createElement('canvas');await QRCode.toCanvas(qrCanvas,url.href,{width:420,margin:2});qr.innerHTML='';qr.appendChild(qrCanvas);status.style.display='none';badge.style.display='block';buttons.style.display='grid'}catch(e){status.textContent=e.message}}function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill();}function downloadBadge(){if(!emp||!qrCanvas)return;const c=document.createElement('canvas');c.width=1000;c.height=1350;const x=c.getContext('2d');x.fillStyle='#f3f4f6';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';roundRect(x,70,70,860,1210,55);x.textAlign='center';x.fillStyle='#781327';x.font='900 38px Arial';x.fillText('V-POINTS • VARDA GROUP',500,160);x.fillStyle='#111827';x.font='900 58px Arial';x.fillText(emp.full_name||emp.name||'Employee',500,260);x.fillStyle='#667085';x.font='32px Arial';x.fillText(emp.branch_name||emp.branch||emp.area_name||'Varda Group',500,315);x.drawImage(qrCanvas,260,390,480,480);x.fillStyle='#111827';x.font='900 40px Arial';x.fillText('SCAN TO RATE MY SERVICE',500,950);x.fillStyle='#667085';x.font='28px Arial';x.fillText('Official employee feedback',500,1000);x.fillStyle='#781327';x.fillRect(180,1080,640,8);x.fillStyle='#667085';x.font='24px Arial';x.fillText('V-POINTS Employee QR Badge',500,1150);const a=document.createElement('a');a.download='VPOINTS-'+(emp.full_name||emp.name||'employee').replace(/[^a-z0-9]+/gi,'-')+'-QR.png';a.href=c.toDataURL('image/png');a.click()}init();</script></body></html>
