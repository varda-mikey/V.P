<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#781327"><title>V-POINTS Employee QR Badge</title><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><style>:root{font-family:Inter,Arial,sans-serif;color:#182230}*{box-sizing:border-box}body{margin:0;background:#f3f4f6}.top{background:#781327;color:white;padding:18px;text-align:center}.top h1{margin:0;font-size:23px}.top p{margin:5px 0 0;opacity:.8;font-size:12px}.wrap{max-width:520px;margin:20px auto;padding:15px}.badge{background:#fff;border-radius:26px;padding:24px;text-align:center;box-shadow:0 10px 30px #00000012}.brand{font-weight:950;color:#781327;font-size:14px}.photo{width:92px;height:92px;border-radius:50%;background:#f2e5e8;margin:14px auto 0;overflow:hidden;display:grid;place-items:center;font-size:30px;font-weight:900;color:#781327}.photo img{width:100%;height:100%;object-fit:cover}.name{font-size:25px;font-weight:950;margin-top:10px}.meta{font-size:13px;color:#667085;margin:5px 0 15px}.qrbox{display:flex;justify-content:center;padding:8px}.qrbox canvas{max-width:260px;width:70%!important;height:auto!important}.cta{font-weight:950;margin-top:8px}.hint{font-size:11px;color:#667085;margin-top:4px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.buttons button{border:0;border-radius:14px;padding:13px;font-weight:900;text-align:center}.download{background:#781327;color:#fff}.print{background:#fff;color:#781327;border:1px solid #ddd!important}.status{text-align:center;color:#667085;padding:18px;line-height:1.5}.status.error{color:#b42318;background:#fef3f2;border-radius:14px}.small{font-size:11px;color:#98a2b3;margin-top:12px;line-height:1.5}@media print{.top,.buttons,.small{display:none}body{background:white}.wrap{margin:0 auto}.badge{box-shadow:none;border:1px solid #ddd}}</style></head><body><div class="top"><h1>V-POINTS QR BADGE</h1><p>Employee customer feedback badge</p></div><main class="wrap"><div id="status" class="status">Loading employee…</div><section id="badge" class="badge" style="display:none"><div class="brand">V-POINTS • VARDA GROUP</div><div id="photo" class="photo">VP</div><div id="name" class="name"></div><div id="meta" class="meta"></div><div id="qr" class="qrbox"></div><div class="cta">SCAN TO RATE MY SERVICE</div><div class="hint">Official employee feedback</div></section><div id="buttons" class="buttons" style="display:none"><button id="downloadBtn" class="download">DOWNLOAD PNG</button><button id="printBtn" class="print">PRINT BADGE</button></div><div class="small">This badge links only to the employee’s official V-POINTS feedback page.</div></main><script>const FEEDBACK='https://lwjeroszacnqibggxair.supabase.co/functions/v1/vpoints-feedback';const qs=new URLSearchParams(location.search);const uid=qs.get('employee');const statusEl=document.getElementById('status'),badgeEl=document.getElementById('badge'),buttonsEl=document.getElementById('buttons'),photoEl=document.getElementById('photo'),nameEl=document.getElementById('name'),metaEl=document.getElementById('meta'),qrEl=document.getElementById('qr'),downloadBtn=document.getElementById('downloadBtn'),printBtn=document.getElementById('printBtn');let emp=null,qrCanvas=null;function initials(v){return String(v||'VP').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function fail(msg){statusEl.textContent=msg;statusEl.classList.add('error');badgeEl.style.display='none';buttonsEl.style.display='none'}async function loadEmployee(){if(!uid){fail('Employee QR was not specified. Please open this badge from the employee card inside V-POINTS.');return}const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(FEEDBACK+'?employee='+encodeURIComponent(uid),{cache:'no-store',signal:ctl.signal});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Employee not available');if(!j.employee)throw Error('Employee data was not returned');emp=j.employee;nameEl.textContent=emp.name||'V-POINTS Employee';metaEl.textContent=[emp.position,emp.branch||(emp.area?emp.area+' Area':'')].filter(Boolean).join(' • ')||'Varda Group';photoEl.textContent=initials(emp.name);if(emp.photo_url){const img=document.createElement('img');img.src=emp.photo_url;img.alt='Employee photo';img.loading='eager';img.decoding='async';img.onload=()=>{photoEl.innerHTML='';photoEl.appendChild(img)};img.onerror=()=>{photoEl.textContent=initials(emp.name)}}if(typeof QRCode==='undefined'||!QRCode.toCanvas)throw Error('QR generator did not load. Please refresh once.');const ratingUrl=new URL('rate.html',location.href);ratingUrl.searchParams.set('employee',uid);qrCanvas=document.createElement('canvas');await QRCode.toCanvas(qrCanvas,ratingUrl.href,{width:420,margin:2});qrEl.innerHTML='';qrEl.appendChild(qrCanvas);statusEl.style.display='none';badgeEl.style.display='block';buttonsEl.style.display='grid'}catch(e){fail(e.name==='AbortError'?'Employee lookup timed out. Please refresh once.':(e.message||'Unable to load employee.'))}finally{clearTimeout(timer)}}function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill()}async function getImg(url){if(!url)return null;return await new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>res(null);i.src=url})}async function downloadBadge(){if(!emp||!qrCanvas)return;const c=document.createElement('canvas');c.width=1000;c.height=1450;const x=c.getContext('2d');x.fillStyle='#f3f4f6';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';rr(x,70,70,860,1310,55);x.textAlign='center';x.fillStyle='#781327';x.font='900 38px Arial';x.fillText('V-POINTS • VARDA GROUP',500,145);const img=await getImg(emp.photo_url);if(img){x.save();x.beginPath();x.arc(500,260,88,0,Math.PI*2);x.clip();x.drawImage(img,412,172,176,176);x.restore()}else{x.fillStyle='#f2e5e8';x.beginPath();x.arc(500,260,88,0,Math.PI*2);x.fill();x.fillStyle='#781327';x.font='900 46px Arial';x.fillText(initials(emp.name),500,276)}x.fillStyle='#111827';x.font='900 54px Arial';x.fillText(emp.name||'Employee',500,390);x.fillStyle='#667085';x.font='28px Arial';x.fillText([emp.position,emp.branch||(emp.area?emp.area+' Area':'')].filter(Boolean).join(' • ')||'Varda Group',500,435);x.drawImage(qrCanvas,260,500,480,480);x.fillStyle='#111827';x.font='900 40px Arial';x.fillText('SCAN TO RATE MY SERVICE',500,1060);x.fillStyle='#667085';x.font='28px Arial';x.fillText('Official employee feedback',500,1110);x.fillStyle='#781327';x.fillRect(180,1190,640,8);x.fillStyle='#667085';x.font='24px Arial';x.fillText('V-POINTS Employee QR Badge',500,1260);const a=document.createElement('a');a.download='VPOINTS-'+(emp.name||'employee').replace(/[^a-z0-9]+/gi,'-')+'-QR.png';a.href=c.toDataURL('image/png');a.click()}downloadBtn.addEventListener('click',downloadBadge);printBtn.addEventListener('click',()=>window.print());loadEmployee();</script></body></html>
