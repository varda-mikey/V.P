<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-POINTS QR Badge Maker</title><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><style>:root{font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#111}.tools{padding:14px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tools input{padding:10px;border:1px solid #ccc;border-radius:10px;min-width:190px}.tools button{border:0;border-radius:10px;background:#7b1022;color:#fff;padding:11px 16px;font-weight:700}.sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:10mm;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:62mm;gap:5mm}.badge{border:1px solid #bbb;border-radius:4mm;padding:3mm;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;break-inside:avoid}.brand{font-size:8px;font-weight:800;color:#7b1022}.name{font-size:12px;font-weight:800;margin:1.5mm 0 .5mm}.meta{font-size:7px;color:#555;margin-bottom:1.5mm}.qr canvas{width:27mm!important;height:27mm!important}.cta{font-size:8px;font-weight:800;margin-top:1mm}.hint{font-size:6px;color:#777}.empty{color:#999;font-size:9px}@page{size:A4;margin:0}@media print{body{background:#fff}.tools{display:none}.sheet{margin:0;width:210mm;min-height:297mm}}</style></head><body><div class="tools"><input id="employee" placeholder="Employee UUID"><input id="name" placeholder="Employee name"><input id="branch" placeholder="Branch"><button onclick="addBadge()">Add Badge</button><button onclick="window.print()">Print A4</button></div><main class="sheet" id="sheet"></main><script>const sheet=document.getElementById('sheet');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function makeBadge(p){const el=document.createElement('section');el.className='badge';el.innerHTML='<div class="brand">V-POINTS • VARDA GROUP</div><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.branch)+'</div><div class="qr"></div><div class="cta">SCAN TO RATE MY SERVICE</div><div class="hint">Official employee feedback</div>';const ratingUrl=new URL('rate.html',location.href);ratingUrl.searchParams.set('employee',p.employee);QRCode.toCanvas(el.querySelector('.qr'),ratingUrl.href,{width:220,margin:1});return el}function addBadge(){const p={employee:document.getElementById('employee').value.trim(),name:document.getElementById('name').value.trim(),branch:document.getElementById('branch').value.trim()};if(!p.employee||!p.name){alert('Employee UUID and name are required.');return}if(sheet.querySelector('.empty'))sheet.innerHTML='';sheet.appendChild(makeBadge(p))}for(let i=0;i<12;i++){const e=document.createElement('section');e.className='badge empty';e.textContent='Employee QR badge slot';sheet.appendChild(e)}</script></body></html>
