<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#781327"><title>V-POINTS</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:950;color:#781327}.out,.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:#667085}.hero{margin-top:25px;background:#781327;color:#fff;border-radius:25px;padding:22px}.hero small{opacity:.75;font-weight:800}.hero h1{margin:7px 0 3px;font-size:27px}.hero p{margin:0;color:#f3dce1}.section{margin-top:24px}.section h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.tile{background:#fff;border:0;text-align:left;border-radius:18px;padding:16px;min-height:100px;box-shadow:0 7px 25px #1720330b}.tile b{display:block;font-size:15px;margin-bottom:6px}.tile span{font-size:12px;color:#667085;line-height:1.35}.wide{grid-column:1/-1}.screen{display:none}.screen.on{display:block}.bar{display:flex;gap:10px;align-items:center;margin:22px 0 14px}.bar h2{margin:0;font-size:20px}.person{background:#fff;border-radius:18px;padding:15px;margin:10px 0;display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;background:#f1e5e8;color:#781327;display:grid;place-items:center;font-weight:950}.info{flex:1}.info b{display:block}.info small{color:#667085}.pts{text-align:right;font-weight:950;color:#781327}.pts small{display:block;font-size:10px;color:#98a2b3}.field{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:13px;margin:6px 0;font:inherit}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:#781327;color:#fff;font-weight:900;margin-top:8px}.form{background:#fff;border-radius:20px;padding:17px}.msg{font-size:12px;margin-top:10px}.search{margin-bottom:12px}.actions{display:flex;gap:7px;margin-top:8px}.mini{border:0;border-radius:10px;padding:8px 10px;font-weight:850}.plus{background:#ecfdf3;color:#027a48}.minus{background:#fef3f2;color:#b42318}</style></head><body><main class="app"><div id="main" class="screen on"><header class="top"><div class="logo">V-POINTS!</div><button class="out" onclick="logout()">EXIT</button></header><section class="hero"><small>AUTHORIZED MANAGEMENT VIEW</small><h1 id="scope">V-POINTS</h1><p>Processed by <span id="who"></span></p></section><section class="section"><h2>People & Performance</h2><div class="grid"><button class="tile wide" onclick="openProfiles()"><b>Employee Profiles</b><span>View points and manage employee performance within your scope.</span></button><button class="tile" onclick="openProfiles()"><b>Merit / Demerit</b><span>Adjust points with a required reason and audit trail.</span></button><button class="tile"><b>Customer Ratings</b><span>Positive and improvement feedback.</span></button><button class="tile"><b>Leaders</b><span>Monitor leader activity and teams.</span></button><button class="tile" onclick="show('add')"><b>Add Profile</b><span>Add an employee. No login account required.</span></button></div></section><section class="section"><h2>Operations</h2><div class="grid"><button class="tile"><b>Missions & Tasks</b><span>Assignments and follow-through.</span></button><button class="tile"><b>Memo & Policy</b><span>Acknowledgements and policy records.</span></button><button class="tile"><b>FSQA / Audit</b><span>Findings, evidence and actions.</span></button><button class="tile"><b>Training</b><span>Training records and recognition.</span></button></div></section></div><div id="profiles" class="screen"><div class="bar"><button class="back" onclick="show('main')">‹ BACK</button><h2>Employee Profiles</h2></div><input id="search" class="field search" placeholder="Search employee" oninput="render()"><div id="people">Loading…</div></div><div id="add" class="screen"><div class="bar"><button class="back" onclick="show('main')">‹ BACK</button><h2>Add Profile</h2></div><div class="form"><input class="field" id="full" placeholder="Employee full name"><select class="field" id="role"><option value="employee">Employee</option><option value="team_leader">Team Leader</option><option value="manager">Manager</option><option value="admin">Admin / Assistant</option></select><select class="field" id="branch"><option value="">Select branch ID</option><option value="1">DLSL Food Park</option><option value="2">Ateneo 2GONZ</option><option value="3">Mapua Davao Food Hall</option><option value="4">LPU Main Batangas</option><option value="5">LPU Lima Maritime</option><option value="6">PUP Manila</option><option value="7">St. Jude</option><option value="8">National Branch</option></select><button class="primary" onclick="addProfile()">CREATE PROFILE • 100 POINTS</button><div class="msg" id="addmsg"></div></div></div></main><script>const API='https://lwjeroszacnqibggxair.supabase.co/functions/v1/vpoints-management',token=sessionStorage.getItem('vpoints_scope_session'),raw=sessionStorage.getItem('vpoints_scope'),who=sessionStorage.getItem('vpoints_processed_by');let people=[];if(!token||!raw)location.replace('./');else{const s=JSON.parse(raw);document.getElementById('scope').textContent=s.display_name;document.getElementById('who').textContent=who||'Authorized User'}function logout(){sessionStorage.clear();location.replace('./')}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}async function call(method='GET',body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-vpoints-session':token},body:body?JSON.stringify(body):undefined}),j=await r.json();if(!r.ok){if(r.status===401)logout();throw Error(j.error||'Unable to continue')}return j}async function openProfiles(){show('profiles');try{const j=await call();people=j.profiles||[];render()}catch(e){document.getElementById('people').textContent=e.message}}function initials(n){return n.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()}function render(){const q=document.getElementById('search').value.toLowerCase(),box=document.getElementById('people'),list=people.filter(p=>p.full_name.toLowerCase().includes(q));box.innerHTML=list.length?list.map(p=>`<div class="person"><div class="avatar">${initials(p.full_name)}</div><div class="info"><b>${p.full_name}</b><small>${p.role.replaceAll('_',' ')} • ${(p.branches&&p.branches.name)||'Branch'}</small><div class="actions"><button class="mini plus" onclick="adjust('${p.user_id}',1)">+ MERIT</button><button class="mini minus" onclick="adjust('${p.user_id}',-1)">− DEMERIT</button></div></div><div class="pts">${Number(p.points).toFixed(1)}<small>POINTS</small></div></div>`).join(''):'No employee profiles found.'}async function adjust(uid,dir){const amount=prompt(dir>0?'How many merit points?':'How many demerit points?','1');if(amount===null)return;const n=Math.abs(Number(amount));if(!n)return;const reason=prompt('Reason / evidence summary:');if(!reason)return;try{const j=await call('POST',{action:'adjust_points',employee_user_id:uid,points_delta:dir*n,reason});const p=people.find(x=>x.user_id===uid);if(p)p.points=j.points;render()}catch(e){alert(e.message)}}async function addProfile(){const m=document.getElementById('addmsg');m.textContent='Creating…';try{const j=await call('POST',{action:'add_profile',full_name:document.getElementById('full').value,role:document.getElementById('role').value,branch_id:Number(document.getElementById('branch').value)});m.textContent=`Created ${j.profile.full_name} • ${j.profile.employee_code} • 100 V-POINTS`;document.getElementById('full').value=''}catch(e){m.textContent=e.message}}</script></body></html>
