<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#781327"><title>V-POINTS</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#182230;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding-bottom:60px}.head{background:#781327;color:white;padding:20px 18px 25px;border-radius:0 0 26px 26px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:950}.exit{border:0;background:#ffffff20;color:white;border-radius:12px;padding:9px 13px;font-weight:800}.scope{margin-top:20px}.scope small{opacity:.72;font-weight:800}.scope h1{font-size:22px;margin:5px 0}.scope p{margin:0;opacity:.8;font-size:13px}.body{padding:18px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 13px}.chip{white-space:nowrap;border:1px solid #e1e4e8;background:white;padding:9px 13px;border-radius:99px;font-weight:800;color:#667085}.chip.on{background:#781327;color:white;border-color:#781327}.tools{display:flex;gap:8px;margin-bottom:13px}.search{flex:1;padding:12px;border:1px solid #d0d5dd;border-radius:13px;font:inherit}.add{border:0;border-radius:13px;background:#781327;color:white;font-weight:900;padding:0 14px}.rank{font-size:14px;color:#667085;font-weight:800;margin:12px 2px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.form{background:white;border-radius:20px;padding:16px;box-shadow:0 2px 12px #1018280a;position:relative}.place{position:absolute;right:13px;top:13px;font-size:11px;font-weight:900;color:#9b6b00;background:#fff6d8;padding:5px 8px;border-radius:99px}.person{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;background:#f2e5e8;display:grid;place-items:center;color:#781327;font-size:18px;font-weight:950}.name{font-weight:950;font-size:15px;padding-right:40px}.meta{font-size:11px;color:#667085;text-transform:capitalize;margin-top:3px}.points{font-size:28px;font-weight:950;color:#781327;margin-top:13px}.points small{font-size:10px;color:#98a2b3;margin-left:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.btn{border:0;border-radius:10px;padding:9px 5px;font-size:10px;font-weight:900}.merit{background:#ecfdf3;color:#067647}.incident{background:#fff4ed;color:#b54708}.detail{background:#f2f4f7;color:#475467}.wide{grid-column:1/-1}.empty{background:white;border-radius:18px;padding:30px;text-align:center;color:#667085}.screen{display:none}.screen.on{display:block}.bar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.back{border:0;background:white;border-radius:12px;padding:10px;font-weight:900}.field{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:13px;margin:6px 0;font:inherit}.area{min-height:110px;resize:vertical}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:#781327;color:white;font-weight:900;margin-top:8px}.msg,.note{font-size:12px;margin-top:10px}.note{background:#fff7ed;color:#9a3412;padding:12px;border-radius:12px;line-height:1.45}.manage{display:flex;gap:8px;margin-top:14px}.manage button{border:0;background:white;border-radius:12px;padding:10px 12px;font-weight:800;color:#781327}@media(max-width:600px){.cards{grid-template-columns:1fr}.app{max-width:none}.body{padding:14px}.card{padding:15px}}</style></head><body><main class="app"><section id="dashboard" class="screen on"><div class="head"><div class="top"><div class="logo">V-POINTS!</div><button class="exit" onclick="logout()">EXIT</button></div><div class="scope"><small>PERFORMANCE DASHBOARD</small><h1 id="scope">V-POINTS</h1><p id="scopeText">Your authorized people and performance view</p><div class="manage"><button onclick="show('addscreen')">＋ ADD PROFILE</button><button id="branchBtn" style="display:none">MANAGE BRANCHES</button></div></div></div><div class="body"><div class="filters"><button class="chip on" data-filter="all">ALL</button><button class="chip" data-filter="leaders">LEADERS</button><button class="chip" data-filter="admins">ADMINS</button><button class="chip" data-filter="staff">STAFF</button></div><div class="tools"><input id="search" class="search" placeholder="Search employee…"><button class="add" onclick="loadPeople()">↻</button></div><div class="rank" id="count">Loading people…</div><div id="people" class="cards"></div></div></section><section id="incidentscreen" class="screen"><div class="body"><div class="bar"><button class="back" onclick="show('dashboard')">‹ BACK</button><h2>Report Incident</h2></div><div class="form"><b id="incidentName">Employee</b><div class="note">Reporting an incident does not deduct V-POINTS. The report is submitted for review and any outcome must follow the authorized process.</div><textarea id="idesc" class="field area" placeholder="Describe what happened • required"></textarea><textarea id="ievidence" class="field area" placeholder="Evidence summary / witnesses / supporting details"></textarea><input id="ipolicy" class="field" placeholder="Varda Act / policy basis, if known"><button id="isubmit" class="primary" onclick="submitIncident()">SUBMIT FOR REVIEW</button><div id="imsg" class="msg"></div></div></div></section><section id="addscreen" class="screen"><div class="body"><div class="bar"><button class="back" onclick="show('dashboard')">‹ BACK</button><h2>Add Profile</h2></div><div class="form"><input class="field" id="full" placeholder="Employee full name"><select class="field" id="role"><option value="employee">Employee</option><option value="team_leader">Team Leader</option><option value="manager">Manager</option><option value="admin">Admin / Admin Assistant</option><option value="regional_retail_head">Regional Retail Head</option><option value="national_retail_head">National Retail Head</option><option value="executive">Executive</option></select><select class="field" id="branch"><option value="">Select branch</option><option value="1">DLSL Food Park</option><option value="2">Ateneo 2GONZ</option><option value="3">Mapua Davao Food Hall</option><option value="4">LPU Main Batangas</option><option value="5">LPU Lima Maritime</option><option value="6">PUP Manila</option><option value="7">St. Jude</option><option value="8">National Branch</option><option value="9">LPU Davao – LPU Central Park</option></select><button class="primary" onclick="addProfile()">CREATE PROFILE • 100 POINTS</button><div id="addmsg" class="msg"></div></div></div></section></main><script>const API='https://lwjeroszacnqibggxair.supabase.co/functions/v1/vpoints-management';const token=sessionStorage.getItem('vpoints_scope_session'),raw=sessionStorage.getItem('vpoints_scope');let data=[],filter='all',s={},incidentUid='';if(!token||!raw)location.replace('./');else{try{s=JSON.parse(raw);scope.textContent=s.display_name;if(s.access_key==='national-retail')branchBtn.style.display='block';if(s.access_key&&s.access_key.endsWith('-admin'))scopeText.textContent='People within your authorized regional level'}catch{location.replace('./')}}function logout(){sessionStorage.clear();location.replace('./')}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}async function call(method='GET',body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-vpoints-session':token},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Unable to continue');return j}function initials(n){return n.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function group(p){if(['regional_retail_head','national_retail_head','team_leader','manager','executive'].includes(p.role))return'leaders';if(p.role==='admin')return'admins';return'staff'}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const q=search.value.trim().toLowerCase();let list=data.filter(p=>(filter==='all'||group(p)===filter)&&p.full_name.toLowerCase().includes(q));count.textContent=list.length+' PEOPLE • SORTED BY V-POINTS';people.innerHTML=list.length?list.map((p,i)=>`<article class="card"><span class="place">TOP ${i+1}</span><div class="person"><div class="avatar">${initials(p.full_name)}</div><div><div class="name">${esc(p.full_name)}</div><div class="meta">${esc(p.role.replaceAll('_',' '))} • ${esc(p.branch_name||'Branch')}</div></div></div><div class="points">${Number(p.points).toFixed(1)} <small>V-POINTS</small></div><div class="actions"><button class="btn merit" onclick="merit('${p.user_id}')">＋ MERIT</button><button class="btn incident" onclick="incident('${p.user_id}')">REPORT INCIDENT</button><button class="btn detail" onclick="notice('Credentials')">CREDENTIALS</button><button class="btn detail" onclick="notice('Evaluation Records')">EVALUATION RECORDS</button></div></article>`).join(''):'<div class="empty wide">No profiles available in this access level.</div>'}async function loadPeople(){count.textContent='Loading people…';try{const j=await call();data=j.profiles||[];data.sort((a,b)=>Number(b.points)-Number(a.points));render()}catch(e){people.innerHTML='<div class="empty wide">'+esc(e.message)+'</div>';count.textContent='Unable to load'}}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});search.oninput=render;async function merit(uid){const amount=prompt('Merit points:','1');if(amount===null)return;const n=Math.abs(Number(amount));if(!n)return;const reason=prompt('Merit reason / evidence summary:');if(!reason)return;try{const j=await call('POST',{action:'merit',employee_user_id:uid,points:n,reason});const p=data.find(x=>x.user_id===uid);if(p)p.points=j.points;data.sort((a,b)=>Number(b.points)-Number(a.points));render()}catch(e){alert(e.message)}}function incident(uid){const p=data.find(x=>x.user_id===uid);if(!p)return;incidentUid=uid;incidentName.textContent=p.full_name+' • '+p.role.replaceAll('_',' ');idesc.value='';ievidence.value='';ipolicy.value='';imsg.textContent='';show('incidentscreen')}async function submitIncident(){const description=idesc.value.trim();if(!description){imsg.textContent='Please describe the incident.';return}isubmit.disabled=true;isubmit.textContent='SUBMITTING…';imsg.textContent='';try{await call('POST',{action:'report_incident',employee_user_id:incidentUid,description,evidence_summary:ievidence.value.trim(),policy_basis:ipolicy.value.trim()});imsg.textContent='Submitted successfully • PENDING REVIEW • No points deducted.';idesc.value='';ievidence.value='';ipolicy.value=''}catch(e){imsg.textContent=e.message}finally{isubmit.disabled=false;isubmit.textContent='SUBMIT FOR REVIEW'}}function notice(x){alert(x+' module will open from this employee profile.')}async function addProfile(){if(!full.value.trim()||!branch.value){addmsg.textContent='Name and branch are required.';return}addmsg.textContent='Creating…';try{const j=await call('POST',{action:'add_profile',full_name:full.value.trim(),role:role.value,branch_id:Number(branch.value)});addmsg.textContent='Created '+j.profile.full_name+' • 100 V-POINTS';full.value='';await loadPeople();setTimeout(()=>show('dashboard'),500)}catch(e){addmsg.textContent=e.message}}loadPeople();</script></body></html>
