<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#781327"><title>V-POINTS</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:25px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:950;color:#781327}.out{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:#667085}.hero{margin-top:28px;background:#781327;color:#fff;border-radius:26px;padding:24px}.hero small{opacity:.75;font-weight:800}.hero h1{margin:8px 0 4px;font-size:28px}.hero p{margin:0;color:#f3dce1}.section{margin-top:25px}.section h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{background:#fff;border:0;text-align:left;border-radius:19px;padding:17px;min-height:105px;box-shadow:0 7px 25px #1720330b}.tile b{display:block;font-size:15px;margin-bottom:6px}.tile span{font-size:12px;color:#667085;line-height:1.35}.wide{grid-column:1/-1}.notice{margin-top:18px;padding:14px;background:#fff;border-radius:16px;font-size:12px;color:#667085;line-height:1.5}.who{font-weight:850;color:#172033}</style></head><body><main class="app"><header class="top"><div class="logo">V-POINTS!</div><button class="out" id="out">EXIT</button></header><section class="hero"><small>AUTHORIZED MANAGEMENT VIEW</small><h1 id="scope">Loading…</h1><p>Processed by <span id="who"></span></p></section><section class="section"><h2>People & Performance</h2><div class="grid"><button class="tile wide"><b>Employee Profiles</b><span>View employees, points, standing, ratings and complete performance history within your authorized scope.</span></button><button class="tile"><b>Merit / Demerit</b><span>Record justified point changes with evidence and audit history.</span></button><button class="tile"><b>Customer Ratings</b><span>Review positive and improvement stars and pending acknowledgements.</span></button><button class="tile"><b>Leaders</b><span>Monitor leader activity, team checks and performance.</span></button><button class="tile"><b>Add Profile</b><span>Add employees to the correct branch without creating login accounts.</span></button></div></section><section class="section"><h2>Operations</h2><div class="grid"><button class="tile"><b>Missions & Tasks</b><span>Assignments, shared tasks and follow-through.</span></button><button class="tile"><b>Memo & Policy</b><span>Acknowledgements and policy records.</span></button><button class="tile"><b>FSQA / Audit</b><span>Findings, evidence and assigned actions.</span></button><button class="tile"><b>Training</b><span>Training records and earned recognition.</span></button></div></section><div class="notice">Your access is automatically filtered by your management PIN. Important actions will be attached to <span class="who" id="auditWho"></span> for accountability.</div></main><script>const raw=sessionStorage.getItem('vpoints_scope'),token=sessionStorage.getItem('vpoints_scope_session'),who=sessionStorage.getItem('vpoints_processed_by');if(!raw||!token){location.replace('./')}else{const s=JSON.parse(raw);document.getElementById('scope').textContent=s.display_name||'V-POINTS';document.getElementById('who').textContent=who||'Authorized User';document.getElementById('auditWho').textContent=who||'the authorized user'}document.getElementById('out').onclick=()=>{sessionStorage.clear();location.replace('./')};</script></body></html>
