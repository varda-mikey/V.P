<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#781327"><title>V-POINTS</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#182230;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding-bottom:60px}.head{background:#781327;color:#fff;padding:20px 18px 25px;border-radius:0 0 26px 26px}.top,.bar{display:flex;align-items:center;gap:10px}.top{justify-content:space-between}.logo{font-size:27px;font-weight:950}.exit,.back{border:0;background:#ffffff20;color:inherit;border-radius:12px;padding:10px;font-weight:900}.scope{margin-top:20px}.scope h1{font-size:22px;margin:5px 0}.scope p{margin:0;opacity:.8;font-size:13px}.body{padding:18px}.filters,.manage{display:flex;gap:8px;overflow:auto;margin:12px 0}.chip,.manage button{white-space:nowrap;border:1px solid #e1e4e8;background:#fff;padding:9px 13px;border-radius:99px;font-weight:800;color:#667085}.chip.on{background:#781327;color:#fff}.manage button{color:#781327}.tools{display:flex;gap:8px}.search,.field{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:13px;font:inherit;margin:5px 0}.add,.primary{border:0;border-radius:13px;background:#781327;color:#fff;font-weight:900;padding:12px}.primary{width:100%;margin-top:8px}.rank{font-size:13px;color:#667085;font-weight:800;margin:13px 2px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.form,.record{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 12px #1018280a;position:relative}.place{position:absolute;right:13px;top:13px;font-size:10px;font-weight:900;background:#fff6d8;padding:5px 8px;border-radius:99px}.person{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;background:#f2e5e8;display:grid;place-items:center;color:#781327;font-weight:950}.name{font-weight:950;padding-right:40px}.meta{font-size:11px;color:#667085;text-transform:capitalize}.points{font-size:28px;font-weight:950;color:#781327;margin-top:12px}.points small{font-size:10px;color:#98a2b3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 5px;font-size:10px;font-weight:900}.merit{background:#ecfdf3;color:#067647}.incident{background:#fff4ed;color:#b54708}.detail{background:#f2f4f7;color:#475467}.screen{display:none}.screen.on{display:block}.bar{margin-bottom:15px}.bar .back{background:#fff;color:#781327}.area{min-height:105px}.note{font-size:12px;background:#fff7ed;color:#9a3412;padding:12px;border-radius:12px;margin:10px 0}.msg{font-size:12px;margin-top:10px}.record{margin:9px 0;border-radius:14px}.record b{display:block}.record small{color:#667085}.reviewBtns{display:flex;gap:7px;margin-top:8px}.reviewBtns button{flex:1}.empty{text-align:center;padding:25px;color:#667085}@media(max-width:600px){.cards{grid-template-columns:1fr}.body{padding:14px}}</style></head><body><main class="app"><section id="dashboard" class="screen on"><div class="head"><div class="top"><div class="logo">V-POINTS!</div><button class="exit" onclick="logout()">EXIT</button></div><div class="scope"><small>PERFORMANCE DASHBOARD</small><h1 id="scope">V-POINTS</h1><p id="scopeText">Authorized people & performance view</p><div class="manage"><button id="addBtn" onclick="openAdd()">＋ ADD PROFILE</button><button id="reviewBtn" onclick="openReviews()">PENDING REVIEWS</button><button id="branchBtn" style="display:none" onclick="openBranches()">MANAGE BRANCHES</button></div></div></div><div class="body"><div class="filters"><button class="chip on" data-filter="all">ALL</button><button class="chip" data-filter="leaders">LEADERS</button><button class="chip" data-filter="admins">ADMINS</button><button class="chip" data-filter="staff">STAFF</button></div><div class="tools"><input id="search" class="search" placeholder="Search employee…"><button class="add" onclick="loadPeople()">↻</button></div><div id="count" class="rank">Loading…</div><div id="people" class="cards"></div></div></section><section id="incidentscreen" class="screen"><div class="body"><div class="bar"><button class="back" onclick="show('dashboard')">‹ BACK</button><h2>Report Incident</h2></div><div class="form"><b id="incidentName"></b><div class="note">No automatic deduction. Evidence and policy basis are reviewed before any authorized outcome.</div><textarea id="idesc" class="field area" placeholder="Describe what happened • required"></textarea><textarea id="ievidence" class="field area" placeholder="Evidence / witnesses / supporting details"></textarea><input id="ipolicy" class="field" placeholder="Varda Act / policy basis, if known"><button class="primary" onclick="submitIncident()">SUBMIT FOR REVIEW</button><div id="imsg" class="msg"></div></div></div></section><section id="addscreen" class="screen"><div class="body"><div class="bar"><button class="back" onclick="show('dashboard')">‹ BACK</button><h2>Add Profile</h2></div><div class="form"><input id="full" class="field" placeholder="Employee full name"><select id="role" class="field"><option value="employee">Employee</option><option value="team_leader">Team Leader</option><option value="manager">Manager</option><option value="admin">Admin / Admin Assistant</option><option value="regional_retail_head">Regional Retail Head</option><option value="national_retail_head">National Retail Head</option><option value="executive">Executive</option></select><select id="branch" class="field"></select><button class="primary" onclick="addProfile()">CREATE PROFILE • 100 POINTS</button><div id="addmsg" class="msg"></div></div></div></section><section id="recordscreen" class="screen"><div class="body"><div class="bar"><button class="back" onclick="show('dashboard')">‹ BACK</button><h2 id="recordTitle">Records</h2></div><div id="recordList"></div></div></section><section id="reviewscreen" class="screen"><div class="body"><div class="bar"><button class="back" onclick="show('dashboard')">‹ BACK</button><h2>Pending Reviews</h2></div><div id="reviewList"></div></div></section><section id="branchscreen" class="screen"><div class="body"><div class="bar"><button class="back" onclick="show('dashboard')">‹ BACK</button><h2>Manage Branches</h2></div><div class="form"><input id="newBranch" class="field" placeholder="New branch name"><button class="primary" onclick="addBranch()">ADD BRANCH</button><div id="branchmsg" class="msg"></div><div id="branchList"></div></div></div></section></main><script>const API='https://lwjeroszacnqibggxair.supabase.co/functions/v1/vpoints-management',token=sessionStorage.getItem('vpoints_scope_session'),raw=sessionStorage.getItem('vpoints_scope');let data=[],filter='all',s={},incidentUid='';if(!token||!raw)location.replace('./');else try{s=JSON.parse(raw);scope.textContent=s.display_name;if(s.access_key==='national-retail')branchBtn.style.display='block';if(s.access_key&&s.access_key.endsWith('-admin'))reviewBtn.style.display='none';if(s.can_manage_profiles===false)addBtn.style.display='none'}catch{location.replace('./')}function logout(){sessionStorage.clear();location.replace('./')}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}async function api(path='',method='GET',body){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json','x-vpoints-session':token},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Unable to continue');return j}const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),initials=n=>n.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase(),group=p=>['regional_retail_head','national_retail_head','team_leader','manager','executive'].includes(p.role)?'leaders':p.role==='admin'?'admins':'staff';function render(){const q=search.value.toLowerCase(),list=data.filter(p=>(filter==='all'||group(p)===filter)&&p.full_name.toLowerCase().includes(q));count.textContent=list.length+' PEOPLE • SORTED BY V-POINTS';people.innerHTML=list.length?list.map((p,i)=>`<article class="card"><span class="place">TOP ${i+1}</span><div class="person"><div class="avatar">${initials(p.full_name)}</div><div><div class="name">${esc(p.full_name)}</div><div class="meta">${esc(p.role.replaceAll('_',' '))} • ${esc(p.branch_name||'Branch')}</div></div></div><div class="points">${Number(p.points).toFixed(1)} <small>V-POINTS</small></div><div class="actions"><button class="btn merit" onclick="merit('${p.user_id}')">＋ MERIT</button><button class="btn incident" onclick="incident('${p.user_id}')">REPORT INCIDENT</button><button class="btn detail" onclick="records('${p.user_id}','credentials')">CREDENTIALS</button><button class="btn detail" onclick="records('${p.user_id}','evaluations')">EVALUATION RECORDS</button></div></article>`).join(''):'<div class="empty">No profiles available in this access level.</div>'}async function loadPeople(){try{const j=await api('?view=profiles');data=j.profiles||[];render()}catch(e){count.textContent=e.message}}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});search.oninput=render;async function merit(uid){const v=prompt('Merit points:','1');if(v===null)return;const n=Math.abs(Number(v));if(!n)return;const reason=prompt('Merit reason / evidence summary:');if(!reason)return;try{await api('','POST',{action:'merit',employee_user_id:uid,points:n,reason});alert('Merit submitted for higher approval. Points are unchanged until approved.')}catch(e){alert(e.message)}}function incident(uid){const p=data.find(x=>x.user_id===uid);if(!p)return;incidentUid=uid;incidentName.textContent=p.full_name;idesc.value=ievidence.value=ipolicy.value=imsg.textContent='';show('incidentscreen')}async function submitIncident(){if(!idesc.value.trim())return imsg.textContent='Incident description is required.';try{await api('','POST',{action:'report_incident',employee_user_id:incidentUid,description:idesc.value,evidence_summary:ievidence.value,policy_basis:ipolicy.value});imsg.textContent='Submitted • PENDING REVIEW • No points deducted.';idesc.value=ievidence.value=ipolicy.value=''}catch(e){imsg.textContent=e.message}}async function loadBranches(){const j=await api('?view=branches');return j.branches||[]}async function openAdd(){try{const bs=await loadBranches();branch.innerHTML='<option value="">Select branch</option>'+bs.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');show('addscreen')}catch(e){alert(e.message)}}async function addProfile(){if(!full.value.trim()||!branch.value)return addmsg.textContent='Name and branch required.';try{await api('','POST',{action:'add_profile',full_name:full.value,role:role.value,branch_id:Number(branch.value)});addmsg.textContent='Profile created with 100 V-POINTS.';full.value='';await loadPeople()}catch(e){addmsg.textContent=e.message}}async function records(uid,type){try{const j=await api('?view=records&employee='+encodeURIComponent(uid)),r=j.records||{},arr=r[type]||[];recordTitle.textContent=type==='credentials'?'Credentials':'Evaluation Records';recordList.innerHTML=arr.length?arr.map(x=>`<div class="record"><b>${esc(type==='credentials'?x.title:(x.evaluation_date||'Evaluation'))}</b><small>${esc(type==='credentials'?(x.details||'No details'):(x.summary||'No summary'))}</small></div>`).join(''):'<div class="empty">No records yet.</div>';show('recordscreen')}catch(e){alert(e.message)}}async function openReviews(){try{const j=await api('?view=pending'),p=j.pending||{},ms=p.merits||[],ins=p.incidents||[];reviewList.innerHTML='<h3>Merit Requests</h3>'+(ms.length?ms.map(x=>`<div class="record"><b>${esc(x.employee)} • +${x.points}</b><small>${esc(x.reason)} • Requested by ${esc(x.requested_by)}</small><div class="reviewBtns"><button class="btn merit" onclick="reviewMerit('${x.id}',true)">APPROVE</button><button class="btn incident" onclick="reviewMerit('${x.id}',false)">REJECT</button></div></div>`).join(''):'<div class="empty">No pending merits.</div>')+'<h3>Incident Reports</h3>'+(ins.length?ins.map(x=>`<div class="record"><b>${esc(x.employee)}</b><small>${esc(x.description)}<br>${esc(x.policy_basis||'Policy basis pending')}</small><button class="primary" onclick="reviewIncident('${x.id}')">REVIEW OUTCOME</button></div>`).join(''):'<div class="empty">No pending incidents.</div>');show('reviewscreen')}catch(e){alert(e.message)}}async function reviewMerit(id,approve){try{await api('','POST',{action:'review_merit',request_id:id,approve});await openReviews();await loadPeople()}catch(e){alert(e.message)}}async function reviewIncident(id){const outcome=prompt('Authorized outcome / decision:');if(!outcome)return;const v=prompt('Approved V-POINT deduction (0 for no deduction):','0');if(v===null)return;const d=Math.abs(Number(v));if(!Number.isFinite(d))return alert('Enter a valid deduction.');try{await api('','POST',{action:'review_incident',incident_id:id,outcome,points_deduction:d});await openReviews();await loadPeople()}catch(e){alert(e.message)}}async function openBranches(){try{const bs=await loadBranches();branchList.innerHTML=bs.map(b=>`<div class="record"><b>${esc(b.name)}</b></div>`).join('');show('branchscreen')}catch(e){alert(e.message)}}async function addBranch(){if(!newBranch.value.trim())return;try{await api('','POST',{action:'add_branch',name:newBranch.value.trim()});newBranch.value='';branchmsg.textContent='Branch added.';await openBranches()}catch(e){branchmsg.textContent=e.message}}loadPeople();</script></body></html>
