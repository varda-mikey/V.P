<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#781327"><title>V-POINTS Access</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:500px;margin:auto;min-height:100vh;padding:30px 18px 60px}.logo{font-size:29px;font-weight:950;color:#781327}.tag{font-size:12px;color:#667085}.intro{margin:45px 0 20px}.intro h1{font-size:30px;margin:0 0 8px}.intro p{color:#667085;line-height:1.45}.group{margin-top:22px}.group h3{font-size:11px;letter-spacing:.8px;color:#98a2b3;margin:0 0 9px}.choices{display:grid;gap:9px}.choice{width:100%;border:1px solid #e4e7ec;background:#fff;border-radius:16px;padding:15px;text-align:left;font-weight:850;color:#344054}.choice small{display:block;color:#98a2b3;font-weight:600;margin-top:3px}.choice.sel{border:2px solid #781327;background:#fff8f9;color:#781327}.pinbox{display:none;background:#fff;border-radius:22px;padding:19px;margin-top:20px;box-shadow:0 10px 35px #17203310}.pinbox.on{display:block}.selected{font-weight:900;margin-bottom:13px}.pin{width:100%;border:1px solid #d0d5dd;border-radius:15px;padding:14px;text-align:center;font-size:25px;letter-spacing:13px;outline:none}.go{width:100%;border:0;border-radius:15px;background:#781327;color:#fff;padding:15px;font-weight:900;font-size:15px;margin-top:12px}.error{display:none;margin-top:10px;background:#fef3f2;color:#b42318;padding:11px;border-radius:12px;font-size:12px}.note{text-align:center;color:#98a2b3;font-size:11px;margin-top:16px;line-height:1.5}</style></head><body><main class="app"><div class="logo">V-POINTS!</div><div class="tag">Performance • Growth • Recognition</div><section class="intro"><h1>Choose your access.</h1><p>Select your authorized position, then enter its 4-digit management PIN.</p></section><section class="group"><h3>NATIONAL</h3><div class="choices"><button class="choice" data-key="national-retail" data-label="National Retail Head">National Retail Head<small>National retail management access</small></button><button class="choice" data-key="national-leaders" data-label="National HR / Accounting / FSQA">National HR • Accounting • FSQA<small>Shared National Leaders access</small></button></div></section><section class="group"><h3>SOUTH</h3><div class="choices"><button class="choice" data-key="south-head" data-label="Regional Head — South">Regional Head — South</button><button class="choice" data-key="south-admin" data-label="Regional Admin — South">Regional Admin — South</button></div></section><section class="group"><h3>MANILA</h3><div class="choices"><button class="choice" data-key="manila-head" data-label="Regional Head — Manila">Regional Head — Manila</button><button class="choice" data-key="manila-admin" data-label="Regional Admin — Manila">Regional Admin — Manila</button></div></section><section class="group"><h3>DAVAO</h3><div class="choices"><button class="choice" data-key="davao-head" data-label="Regional Head — Davao">Regional Head — Davao</button><button class="choice" data-key="davao-admin" data-label="Regional Admin — Davao">Regional Admin — Davao</button></div></section><section class="pinbox" id="box"><div class="selected" id="selected"></div><input class="pin" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button class="go" id="go">OPEN V-POINTS</button><div class="error" id="err"></div><div class="note">The selected position and PIN must match.<br>Access is automatically limited to the authorized scope.</div></section></main><script>const API='https://lwjeroszacnqibggxair.supabase.co/functions/v1/vpoints-scope-login';let key='',label='';const pin=document.getElementById('pin'),err=document.getElementById('err'),go=document.getElementById('go');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');key=b.dataset.key;label=b.dataset.label;document.getElementById('selected').textContent=label;document.getElementById('box').classList.add('on');pin.value='';err.style.display='none';setTimeout(()=>pin.focus(),100)});pin.oninput=()=>pin.value=pin.value.replace(/\D/g,'').slice(0,4);async function login(){if(!key||!/^\d{4}$/.test(pin.value))return;err.style.display='none';go.disabled=true;go.textContent='OPENING…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_key:key,pin:pin.value,processed_by:label})}),j=await r.json();if(!r.ok)throw Error(j.error||'Access unavailable');sessionStorage.setItem('vpoints_scope_session',j.session_token);sessionStorage.setItem('vpoints_scope',JSON.stringify(j));sessionStorage.setItem('vpoints_processed_by',label);location.href='home.html'}catch(e){err.textContent=e.message;err.style.display='block';go.disabled=false;go.textContent='OPEN V-POINTS'}}go.onclick=login;pin.onkeydown=e=>{if(e.key==='Enter')login()};</script></body></html>
