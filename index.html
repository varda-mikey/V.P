<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>V-POINTS</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 96px}.brand{font-weight:900;font-size:28px;letter-spacing:-1px}.tag{color:#667085;margin-top:4px}.hero{margin-top:24px;padding:22px;border-radius:24px;background:#fff;box-shadow:0 10px 35px #17203312}.points{font-size:52px;font-weight:900;letter-spacing:-3px}.label{font-size:13px;color:#667085}.status{display:inline-block;margin-top:8px;padding:7px 11px;border-radius:999px;background:#eef7f0;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.tile{background:#fff;border:0;border-radius:20px;padding:18px;text-align:left;min-height:112px;box-shadow:0 6px 24px #1720330d}.tile b{display:block;font-size:16px;margin-top:12px}.tile span{font-size:12px;color:#667085}.note{margin-top:20px;padding:16px;border-radius:18px;background:#eef2ff;font-size:13px;line-height:1.5}.footer{margin-top:28px;color:#98a2b3;font-size:12px;text-align:center}
  </style>
</head>
<body>
<main class="app">
  <div class="brand">V-POINTS!</div><div class="tag">Performance • Growth • Recognition</div>
  <section class="hero"><div class="label">YOUR CURRENT POINTS</div><div class="points">100</div><div class="status">Good Standing</div></section>
  <section class="grid">
    <button class="tile">🎯<b>Missions</b><span>Tasks & shared goals</span></button>
    <button class="tile">👥<b>My Team</b><span>People & performance</span></button>
    <button class="tile">📣<b>Memo Hub</b><span>Updates & acknowledgements</span></button>
    <button class="tile">🎓<b>Training</b><span>Learn & earn merit</span></button>
    <button class="tile">🏆<b>Rewards</b><span>Recognition & claims</span></button>
    <button class="tile">☰<b>More</b><span>Policies, forms & tools</span></button>
  </section>
  <div class="note"><b>V-POINTS is being prepared.</b><br>This clean build is hosted independently on GitHub Pages and is designed to use Supabase for live company data.</div>
  <div class="footer">VARDA GROUP • V-POINTS</div>
</main>
</body>
</html>
