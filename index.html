<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#781327"><title>V-POINTS</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:480px;margin:auto;min-height:100vh;padding:34px 20px 70px;display:flex;flex-direction:column}.logo{font-size:30px;font-weight:950;letter-spacing:-1.2px;color:#781327}.tag{font-size:13px;color:#667085;margin-top:3px}.welcome{margin-top:58px}.welcome h1{font-size:32px;line-height:1.05;margin:0;letter-spacing:-1px}.welcome p{color:#667085;line-height:1.5;margin:10px 0 0}.card{background:#fff;border-radius:26px;padding:22px;margin-top:28px;box-shadow:0 12px 40px #17203312}.label{display:block;font-size:12px;font-weight:800;color:#667085;margin:4px 0 7px}.field{width:100%;border:1px solid #d0d5dd;border-radius:15px;padding:14px 15px;font:inherit;font-weight:700;outline:none;background:#fff}.field:focus{border-color:#781327;box-shadow:0 0 0 3px #78132712}.pin{font-size:24px;letter-spacing:12px;text-align:center;padding-left:26px}.login{width:100%;border:0;border-radius:15px;background:#781327;color:#fff;padding:15px;font-size:16px;font-weight:900;margin-top:18px}.login:disabled{opacity:.55}.error{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:#fef3f2;color:#b42318;font-size:12px}.help{text-align:center;color:#98a2b3;font-size:11px;line-height:1.5;margin-top:16px}.footer{margin-top:auto;padding-top:38px;text-align:center;color:#98a2b3;font-size:11px}.dot{width:42px;height:5px;border-radius:999px;background:#781327;margin:0 0 18px}</style></head><body><main class="app"><div><div class="logo">V-POINTS!</div><div class="tag">Performance • Growth • Recognition</div></div><section class="welcome"><div class="dot"></div><h1>Welcome back.</h1><p>Your performance, recognition and team activity in one simple place.</p></section><section class="card"><label class="label" for="username">USERNAME</label><input class="field" id="username" autocomplete="username" autocapitalize="characters" placeholder="Enter username" maxlength="30"><label class="label" for="pin" style="margin-top:15px">4-DIGIT PIN</label><input class="field pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" pattern="[0-9]{4}" placeholder="••••"><button class="login" id="login">LOGIN</button><div class="error" id="error"></div><div class="help">V-POINTS accounts are issued by authorized management.<br>No employee self-registration.</div></section><div class="footer">VARDA GROUP • V-POINTS</div></main><script>const API='https://lwjeroszacnqibggxair.supabase.co/functions/v1/vpoints-pin-login',btn=document.getElementById('login'),err=document.getElementById('error');document.getElementById('pin').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,4));async function login(){err.style.display='none';const username=document.getElementById('username').value.trim(),pin=document.getElementById('pin').value;if(!username||!/^[0-9]{4}$/.test(pin)){err.textContent='Enter your username and 4-digit PIN.';err.style.display='block';return}btn.disabled=true;btn.textContent='CHECKING…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,pin})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Login failed');if(j.session_token)sessionStorage.setItem('vpoints_session',j.session_token);sessionStorage.setItem('vpoints_user',JSON.stringify(j));location.href='home.html'}catch(e){err.textContent=e.message;err.style.display='block';btn.disabled=false;btn.textContent='LOGIN'}}btn.onclick=login;document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
