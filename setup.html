<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-POINTS First Setup</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:480px;margin:auto;padding:36px 20px}.brand{font-size:29px;font-weight:950;color:#781327}.card{margin-top:45px;background:#fff;border-radius:26px;padding:24px;box-shadow:0 12px 40px #17203312}h1{font-size:25px;margin:0 0 8px}p{font-size:13px;line-height:1.5;color:#667085}.field{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:14px;margin-top:10px;font:inherit;font-weight:800}.pin{font-size:24px;letter-spacing:12px;text-align:center}.btn{width:100%;border:0;border-radius:14px;background:#781327;color:#fff;padding:15px;margin-top:16px;font-weight:900}.msg{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:13px}.ok{background:#ecfdf3;color:#027a48}.bad{background:#fef3f2;color:#b42318}</style></head><body><main class="app"><div class="brand">V-POINTS!</div><section class="card"><h1>Create First Account</h1><p>This one-time setup creates the National Retail Head account. After successful creation, first-account setup closes automatically.</p><input class="field" id="username" value="MIKEY" readonly><input class="field pin" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button class="btn" id="go">CREATE NATIONAL ACCOUNT</button><div class="msg" id="msg"></div></section></main><script>const API='https://lwjeroszacnqibggxair.supabase.co/functions/v1/vpoints-bootstrap-national',m=document.getElementById('msg'),b=document.getElementById('go'),p=document.getElementById('pin');p.oninput=()=>p.value=p.value.replace(/\D/g,'').slice(0,4);b.onclick=async()=>{m.style.display='none';if(!/^\d{4}$/.test(p.value)){m.className='msg bad';m.textContent='Enter your 4-digit PIN.';m.style.display='block';return}b.disabled=true;b.textContent='CREATING…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'MIKEY',pin:p.value})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Setup failed');p.value='';m.className='msg ok';m.innerHTML='Account created successfully. <b>MIKEY</b> is now National Retail Head with 100 starting V-POINTS.<br><br>Returning to login…';m.style.display='block';setTimeout(()=>location.href='./',1800)}catch(e){m.className='msg bad';m.textContent=e.message;m.style.display='block';b.disabled=false;b.textContent='CREATE NATIONAL ACCOUNT'}};</script></body></html>
